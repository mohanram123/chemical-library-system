<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemical Library System</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef8f5 0%, #dfeaf7 100%);
      color: #18332d;
    }

    main {
      padding: 3rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    p {
      margin: 1.25rem 0 0;
      color: #4d6961;
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
    }
  </style>
</head>
<body>
  <main>
    <h1>Chemical Library System</h1>
    <p>coming soon</p>
  </main>
</body>
</html>
